apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci
  namespace: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: payments
spec:
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
    spec:
      serviceAccountName: ci
      containers:
        - name: runner
          image: registry.example.com/ci/runner:7.1.0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager
  namespace: payments
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-pod-manager
  namespace: payments
subjects:
  - kind: ServiceAccount
    name: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-manager
