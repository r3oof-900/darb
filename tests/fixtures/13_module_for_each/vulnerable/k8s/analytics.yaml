apiVersion: v1
kind: Namespace
metadata:
  name: analytics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etl
  namespace: analytics
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/reader-etl
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl
  namespace: analytics
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: etl
          restartPolicy: Never
          containers:
            - name: job
              image: registry.example.com/analytics/etl:1.0.0
