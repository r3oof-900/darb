apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-a
  namespace: apps
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: apps
spec:
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      serviceAccountName: app-a
      containers:
        - name: app
          image: registry.example.com/apps/app:1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-b
  namespace: apps
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::444455556666:role/app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: apps
spec:
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      serviceAccountName: app-b
      containers:
        - name: app
          image: registry.example.com/apps/app:1
