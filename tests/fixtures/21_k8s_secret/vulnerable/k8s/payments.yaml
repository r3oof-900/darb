apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci
  namespace: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-runner
  namespace: payments
spec:
  selector:
    matchLabels:
      app: ci-runner
  template:
    metadata:
      labels:
        app: ci-runner
    spec:
      serviceAccountName: ci
      containers:
        - name: runner
          image: registry.example.com/ci/runner:3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: payments
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-secret-reader
  namespace: payments
subjects:
  - kind: ServiceAccount
    name: ci
    namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: payments
  labels:
    DataClass: secret
type: Opaque
stringData:
  password: dummy
