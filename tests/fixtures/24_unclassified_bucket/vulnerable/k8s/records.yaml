apiVersion: v1
kind: Namespace
metadata:
  name: records
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exporter
  namespace: records
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/records-exporter
---
# No Service: not exposed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exporter
  namespace: records
spec:
  selector:
    matchLabels:
      app: exporter
  template:
    metadata:
      labels:
        app: exporter
    spec:
      serviceAccountName: exporter
      containers:
        - name: exporter
          image: registry.example.com/records/exporter:2.0.1
