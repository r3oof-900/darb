version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Dependencies must be at least two weeks old (tools/depage checks it in CI).
    cooldown:
      default-days: 14
    groups:
      k8s:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      aws:
        patterns: ["github.com/aws/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Dependencies must be at least two weeks old (tools/depage checks it in CI).
    cooldown:
      default-days: 14
