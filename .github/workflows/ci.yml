name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # One shell on every OS: PowerShell splits "-coverprofile=coverage.out"
        # into two arguments on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Fixtures unchanged by tests
        run: git diff --exit-code -- tests/fixtures
      - name: Working tree clean (generated files, go.mod/go.sum)
        run: git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  branch-coverage:
    # docs/DESIGN.md section 6.4: >= 95% branch coverage (gobco) on the core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Install task and gobco
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          go install github.com/rillig/gobco@v1.3.4
      - name: Branch coverage gate
        run: task cover:branch

  fuzz-smoke:
    # Short pass on every change; the 5-minute runs are in fuzz.yml (nightly).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Fuzz each target for 20s
        run: task fuzz FUZZTIME=20s

  junit-schema:
    # Every fixture's JUnit report validates against the JUnit 10 XSD
    # (internal/report/junit/testdata, from jenkinsci/xunit-plugin).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Write the JUnit reports of every fixture
        run: mkdir -p "$RUNNER_TEMP/junit" && DARB_JUNIT_OUT="$RUNNER_TEMP/junit" go test -count=1 -run TestJUnitAndMarkdownReports ./internal/app/
      - name: Validate them against the XSD
        run: |
          ls "$RUNNER_TEMP"/junit/*.xml | wc -l
          xmllint --noout --schema internal/report/junit/testdata/junit-10.xsd "$RUNNER_TEMP"/junit/*.xml

  release-snapshot:
    # .goreleaser.yaml builds, archives and SBOMs on every change (nothing is
    # signed or published), twice: the archives must be byte-identical.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=sign
      - name: Keep the first build's archive checksums
        run: grep -v 'spdx.json' dist/checksums.txt > /tmp/first.txt && cat /tmp/first.txt
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=sign
      - name: The second build is identical
        run: grep -v 'spdx.json' dist/checksums.txt | diff /tmp/first.txt -

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: dependency age (at least 14 days at the commit time)
        run: go run ./tools/depage --at "$(git log -1 --format=%cI)"
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner
