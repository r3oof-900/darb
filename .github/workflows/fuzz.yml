name: fuzz

# docs/DESIGN.md section 15: every fuzz target runs for at least 5 minutes
# without a crash. Nightly, and on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per fuzz target"
        default: "5m"

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: task fuzz FUZZTIME="$FUZZTIME"
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
