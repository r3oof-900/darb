name: integration

# The live collectors against local emulators only: LocalStack for AWS and
# kind for Kubernetes. No job has cloud credentials, and the tests refuse an
# endpoint that is not on the runner.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  localstack:
    runs-on: ubuntu-latest
    services:
      localstack:
        # 4.14.0 is the last LocalStack image that starts without an account
        # token (images from 2026.03 on require LOCALSTACK_AUTH_TOKEN).
        # Pinned by digest.
        image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        ports:
          - 4566:4566
        env:
          SERVICES: sts,iam,s3,kms,secretsmanager,ssm
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Live AWS collector against LocalStack
        env:
          CLAPA_LOCALSTACK_ENDPOINT: http://localhost:4566
          # No real credentials exist in this job; these make sure the SDK
          # never looks for any.
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_EC2_METADATA_DISABLED: "true"
        run: go test -tags integration -count=1 -v -run Integration ./internal/collect/awslive/
