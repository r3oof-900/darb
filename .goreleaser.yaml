# Release build (Phase 7). Run by .github/workflows/release.yml on a v* tag;
# CI builds a snapshot of it on every change (no signing, nothing published).
version: 2
project_name: darb

before:
  hooks:
    - go mod verify

builds:
  - id: darb
    main: ./cmd/darb
    binary: darb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible: no local paths, the commit time as the file time, no
    # build ID; two builds of one tag give identical binaries.
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X github.com/r3oof-900/darb/internal/version.version={{ .Version }}
      - -X github.com/r3oof-900/darb/internal/version.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: darb
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # File times from the commit, so the archives are reproducible too.
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: {mtime: "{{ .CommitDate }}"}
      - src: README.md
        info: {mtime: "{{ .CommitDate }}"}
      - src: SECURITY.md
        info: {mtime: "{{ .CommitDate }}"}
      - src: docs/*.md
        info: {mtime: "{{ .CommitDate }}"}

# One SPDX SBOM per archive (syft).
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature of the checksums (which cover the archives and
# the SBOMs): a Sigstore bundle with the workflow's Fulcio certificate.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    output: true

release:
  draft: true
  prerelease: auto

changelog:
  use: git
  sort: asc
