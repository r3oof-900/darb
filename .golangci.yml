# golangci-lint v2 configuration. See docs/DESIGN.md section 3.
# Regions marked GENERATED are produced from internal/archtest/layers.go by
# `task gen`; a test fails when they drift.
version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod
  modules-download-mode: readonly

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true

linters:
  default: none
  enable:
    # Required by the spec (section 3.3).
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - gocritic
    - depguard
    - exhaustive
    - nilerr
    - bodyclose
    - contextcheck
    # Added: each enforces a rule written in docs/DESIGN.md.
    - nolintlint        # every //nolint must name a linter and give a reason
    - forbidigo         # no fmt.Print*/print/println; no time.Now in core
    - gochecknoglobals  # no package-level mutable state in core (scoped below)
    - errorlint         # %w wrapping and errors.Is/As
    - unused
    - ineffassign
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability of model types over struct packing
    exhaustive:
      default-signifies-exhaustive: false
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - whyNoLint # covered by nolintlint
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(f|ln)?|print|println)$'
          msg: "write to an injected io.Writer; never print from library code"
        - pattern: '^time\.Now$'
          msg: "core packages take 'now' as a parameter (determinism)"
    revive:
      rules:
        - name: file-length-limit
          arguments: [{ max: 400, skipComments: false, skipBlankLines: false }]
        - name: function-length
          arguments: [50, 80]
        - name: cyclomatic
          arguments: [15]
        - name: cognitive-complexity
          arguments: [20]
        - name: deep-exit
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: early-return
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: blank-imports
        - name: dot-imports
        - name: range
        - name: increment-decrement
        - name: empty-block
        - name: defer
        - name: unexported-return
        - name: use-any
    depguard:
      rules:
        # BEGIN GENERATED: depguard (task gen) — DO NOT EDIT
        cmd-clapa:
          list-mode: strict
          files:
            - "**/cmd/clapa/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/r3oof-900/clapa/internal/cli$"
          deny:
            - pkg: "os/exec"
              desc: "forbidden in the entry layer (docs/DESIGN.md section 3)"
            - pkg: "syscall"
              desc: "forbidden in the entry layer (docs/DESIGN.md section 3)"
            - pkg: "plugin"
              desc: "forbidden in the entry layer (docs/DESIGN.md section 3)"
            - pkg: "unsafe"
              desc: "forbidden in the entry layer (docs/DESIGN.md section 3)"
            - pkg: "text/template"
              desc: "forbidden in the entry layer (docs/DESIGN.md section 3)"
            - pkg: "testing"
              desc: "forbidden in the entry layer (docs/DESIGN.md section 3)"
        internal-access:
          list-mode: strict
          files:
            - "**/internal/access/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/r3oof-900/clapa/internal/model$"
            - "github.com/r3oof-900/clapa/internal/arn$"
            - "github.com/r3oof-900/clapa/internal/eval$"
            - "github.com/r3oof-900/clapa/internal/eval/match$"
            - "github.com/r3oof-900/clapa/internal/eval/condition$"
            - "github.com/r3oof-900/clapa/internal/graph$"
          deny:
            - pkg: "os"
              desc: "forbidden in the core layer (docs/DESIGN.md section 3)"
            - pkg: "net"
              desc: "forbidden in the core layer (docs/DESIGN.md section 3)"
            - pkg: "io/fs"
              desc: "forbidden in the core layer (docs/DESIGN.md section 3)"
            - pkg: "io/ioutil"
              desc: "forbidden in the core layer (docs/DESIGN.md section 3)"
            - pkg: "log"
