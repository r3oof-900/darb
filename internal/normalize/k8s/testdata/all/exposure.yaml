apiVersion: v1
kind: Service
metadata:
  name: internal-lb
  namespace: web
  annotations: {service.beta.kubernetes.io/aws-load-balancer-scheme: internal}
spec: {type: LoadBalancer, selector: {app: db}, ports: [{port: 5432}]}
---
apiVersion: v1
kind: Service
metadata:
  name: lbc-default
  namespace: web
  annotations: {service.beta.kubernetes.io/aws-load-balancer-type: external}
spec: {type: LoadBalancer, selector: {app: agent}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-internal
  namespace: web
  annotations: {service.beta.kubernetes.io/aws-load-balancer-internal: "true"}
spec: {type: LoadBalancer, selector: {app: rs}, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata:
  name: public
  namespace: web
  annotations: {service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing}
spec: {type: LoadBalancer, selector: {app: lone}, ports: [{port: 443}]}
---
apiVersion: v1
kind: Service
metadata: {name: nodeport, namespace: web}
spec: {type: NodePort, selector: {app: once}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: headless, namespace: web}
spec: {type: LoadBalancer, ports: [{port: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: web}
spec: {type: ClusterIP, selector: {app: nightly}, ports: [{port: 80}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: web
  annotations: {alb.ingress.kubernetes.io/scheme: internet-facing}
spec:
  defaultBackend: {service: {name: backend, port: {number: 80}}}
  rules:
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 80}}}}
          - {path: /gone, pathType: Prefix, backend: {service: {name: nowhere, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: private
  namespace: web
  annotations: {alb.ingress.kubernetes.io/scheme: internal}
spec:
  rules:
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 80}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: unknown, namespace: web}
spec:
  rules:
    - host: x.example.com
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 80}}}}
